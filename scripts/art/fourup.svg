<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5bd6"/><stop offset="1" stop-color="#3b2f93"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2275"/><stop offset="1" stop-color="#1d165a"/></linearGradient>
    <radialGradient id="pink" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffb3c2"/><stop offset=".5" stop-color="#ff4f7b"/><stop offset="1" stop-color="#b81d4a"/></radialGradient>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff4d2"/><stop offset=".55" stop-color="#ffd08a"/><stop offset="1" stop-color="#c98a2c"/></radialGradient>
    <radialGradient id="hole" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#120d33"/><stop offset="1" stop-color="#241b66"/></radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="104" ry="14" fill="url(#shadow)"/>
  <rect x="28" y="48" width="200" height="176" rx="26" fill="url(#edge)"/>
  <rect x="28" y="40" width="200" height="176" rx="26" fill="url(#board)"/>
  <rect x="36" y="46" width="184" height="10" rx="5" fill="#fff" opacity=".18"/>
  <!-- 4 x 3 holes; a diagonal of four pink, some gold -->
  <g>
    <circle cx="62" cy="80" r="19" fill="url(#hole)"/><circle cx="106" cy="80" r="19" fill="url(#hole)"/><circle cx="150" cy="80" r="19" fill="url(#pink)"/><circle cx="194" cy="80" r="19" fill="url(#hole)"/>
    <circle cx="62" cy="128" r="19" fill="url(#hole)"/><circle cx="106" cy="128" r="19" fill="url(#pink)"/><circle cx="150" cy="128" r="19" fill="url(#gold)"/><circle cx="194" cy="128" r="19" fill="url(#hole)"/>
    <circle cx="62" cy="176" r="19" fill="url(#pink)"/><circle cx="106" cy="176" r="19" fill="url(#gold)"/><circle cx="150" cy="176" r="19" fill="url(#gold)"/><circle cx="194" cy="176" r="19" fill="url(#pink)"/>
  </g>
  <!-- the fourth disc dropping in -->
  <circle cx="194" cy="26" r="19" fill="url(#pink)"/>
  <ellipse cx="188" cy="19" rx="7" ry="4" fill="#fff" opacity=".55"/>
  <path d="M194 52 v10" stroke="#ffb3c2" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
