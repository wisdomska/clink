name: Keep Supabase awake

# Supabase Free pauses a project after 7 days without activity. Once a day,
# one job pings both environments' health endpoints (which touch the
# database) and the Supabase REST APIs directly. Production also gets a daily
# Vercel cron on /api/health (vercel.json), so either one alone is enough.
# Daily, not hourly: every job bills at least a minute of Actions time, and
# hourly runs used up the free allowance.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping app health endpoints
        run: |
          curl -fsS --max-time 30 "https://clinkapp.vercel.app/api/health" || echo "production ping failed"
          curl -fsS --max-time 30 "https://clinkapp-preview.vercel.app/api/health" || echo "preview ping failed"
      - name: Ping Supabase REST
        env:
          PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          PROD_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
          PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          PREVIEW_KEY: ${{ secrets.SUPABASE_PREVIEW_ANON_KEY }}
        run: |
          ping() {
            if [ -z "$1" ]; then echo "secret not set, skipping"; return 0; fi
            curl -fsS --max-time 30 "$1/rest/v1/feature_flags?select=key&limit=1" -H "apikey: $2" -H "Authorization: Bearer $2" || echo "ping failed"
          }
          ping "$PROD_URL" "$PROD_KEY"
          ping "$PREVIEW_URL" "$PREVIEW_KEY"
