name: CI

# Every push gets the quick run: lint, types, unit, database security and the
# browser tests on a phone-sized screen. The full run (all three screen sizes,
# visual checks and Lighthouse) happens nightly and on demand ("Run workflow"),
# which keeps GitHub Actions minutes well inside the free allowance.
on:
  pull_request:
  push:
    branches: [main, preview]
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

# A new push replaces an older push run on the same branch (only the latest
# matters), but full runs (nightly, or started by hand) always finish: they
# get a group of their own and are never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  static:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Dependency scan
        # GHSA-fc5q-39xc-vjpf (picomatch) is ignored in package.json: there is no
        # fixed release yet, and it only reaches us through Sentry's build-time
        # rollup plugin, which never sees user input.
        run: pnpm audit --prod --audit-level high

  integration:
    name: RLS, API, e2e and accessibility
    runs-on: ubuntu-latest
    # The full suite runs about 40 minutes on three device sizes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      # Supabase's Docker images come from GitHub's cache when we have them,
      # so a registry limit ("Data limit exceeded") can't fail a run.
      - name: Restore Supabase images
        id: sb-images
        uses: actions/cache/restore@v5
        with:
          path: /tmp/sb-images
          key: supabase-images-3.1.0-${{ hashFiles('supabase/config.toml') }}
      - name: Load Supabase images
        if: steps.sb-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/sb-images/images.tar
      - name: Start Supabase (migrations + seed)
        run: |
          for i in 1 2 3; do
            supabase start && exit 0
            echo "supabase start failed (try $i), retrying in $((i * 30))s"
            supabase stop --no-backup || true
            sleep $((i * 30))
          done
          exit 1
      - name: Keep the images for next time
        if: steps.sb-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/sb-images
          docker save -o /tmp/sb-images/images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'supabase|postgrest|kong|mailpit|logflare|vector|imgproxy|edge-runtime' | sort -u)
          ls -lh /tmp/sb-images
      - name: Save Supabase images
        if: steps.sb-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/sb-images
          key: supabase-images-3.1.0-${{ hashFiles('supabase/config.toml') }}
      - name: Write .env.local from the local stack
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "STORAGE_DRIVER=supabase"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
          } > .env.local
      - run: pnpm test:rls
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: ffmpeg (the video send test makes its own clip)
        # Ubuntu's mirrors sometimes drop a download: try a few times.
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends --fix-missing ffmpeg && exit 0
            echo "ffmpeg install failed (try $i), retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: e2e (two partners) and axe
        # Quick run: phone only. Full run: phone, tablet and desktop.
        run: pnpm test:e2e --trace off ${{ env.FULL != 'true' && '--project=mobile' || '' }}
      - name: Visual regression (informational)
        if: env.FULL == 'true'
        continue-on-error: true
        timeout-minutes: 10
        # Rendered in Playwright's Docker image, the same one used to record
        # the baselines, so fonts match exactly.
        run: scripts/visual.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse (marketing routes)
    # Nightly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: pnpm dlx @lhci/cli@0.15.1 autorun
